services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: crm_deis
      POSTGRES_USER: crm_user
      # Identifiants reserves au developpement local.
      POSTGRES_PASSWORD: crm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_deis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
